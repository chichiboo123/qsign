name: 윈도우 프로그램 만들기

# 실행 방법: Actions 탭 → "윈도우 프로그램 만들기" → Run workflow
# 또는 v로 시작하는 태그(예: v0.2.0)를 올리면 자동으로 만든다.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 웹 앱 빌드
        run: npm run build
        env:
          VITE_BASE: './'
      - name: 설치 파일(.exe) 만들기
        run: npx electron-builder --win --publish never
        env:
          # 코드 서명 인증서가 없으므로 서명 단계를 건너뛴다
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 점검 - 프로그램을 켜서 첫 화면·글꼴·저장소가 동작하는지 확인
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "release\win-unpacked\Qsign.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "시간 초과" }
          if ($p.ExitCode -ne 0) { throw "점검 실패 (종료 코드 $($p.ExitCode))" }
          Write-Host "점검 통과"
      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: 작업 결과로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: Qsign-windows-${{ steps.ver.outputs.version }}
          path: release/*.exe
      - name: 릴리스(다운로드 페이지)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 큐싸인 v${{ steps.ver.outputs.version }} (윈도우 프로그램)
          make_latest: true
          files: |
            release/Qsign-Setup-*.exe
            release/Qsign-*-Portable.exe
          body: |
            ## 큐싸인 윈도우 프로그램

            | 파일 | 쓰임 |
            |---|---|
            | **Qsign-Setup-${{ steps.ver.outputs.version }}.exe** | 설치형. 바탕 화면·시작 메뉴에 "큐싸인"이 생겨요. 관리자 권한 없이 설치돼요. |
            | **Qsign-${{ steps.ver.outputs.version }}-Portable.exe** | 설치 없이 바로 실행. USB에 넣어 다니며 쓸 수 있어요. |

            - 인터넷 없이 동작해요.
            - 처음 실행할 때 "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 눌러요. (코드 서명 인증서가 없어서 뜨는 안내예요)
            - 프로그램의 공연은 웹 주소(qsign.chichiboo.link)와 **따로** 저장돼요. 웹에서 만든 공연은 [⋯ → 파일로 저장] 후 프로그램에서 [공연 파일 가져오기]로 옮겨요.
            - 새 버전은 이 페이지에서 새 설치 파일을 받아 덮어 설치하면 돼요. 공연은 그대로 남아요.
